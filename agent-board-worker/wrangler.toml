name = "agent-board-worker"
main = "src/index.js"
compatibility_date = "2024-12-01"

# Create the namespace first:
#   npx wrangler kv:namespace create AGENT_BOARD
# then paste the id below.
[[kv_namespaces]]
binding = "AGENT_BOARD"
id = "d2cdb46dee30430b96dbf5b439ed318b"

# Durable Object: per-room WebSocket/SSE coordinator.
[[durable_objects.bindings]]
name = "ROOM_COORDINATOR"
class_name = "RoomCoordinator"

[[migrations]]
tag = "v1"
new_classes = ["RoomCoordinator"]

# All board keys expire after one week.
[vars]
DEFAULT_TTL_SECONDS = "604800"
MAX_MESSAGES = "10"
STALE_STATUS_SECS = "300"
# GitHub OAuth (web UI → worker), device flow. The Client ID is public; the
# device flow needs no client secret. Create an OAuth App (any callback URL,
# e.g. the worker URL) and ENABLE the Device Flow checkbox in its advanced
# settings, then paste its client id here.
GITHUB_CLIENT_ID = ""
# Login allowlist for the web dashboard (GitHub login, not email).
ALLOWED_LOGIN = "katopz"
