[package]
name = "agent_mail"
version = "0.1.0"
publish.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/agent_mail.rs"

[[bin]]
name = "agent-mail"
path = "src/main.rs"

[features]
default = ["tui"]
# `agent-mail top`, the terminal UI for rigs without an IDE (bmo).
tui = ["dep:ratatui"]

[dependencies]
anyhow.workspace = true
ratatui = { version = "0.30", optional = true, default-features = false, features = ["crossterm", "layout-cache"] }
base64.workspace = true
regex = { workspace = true, features = ["unicode"] }
chrono = { workspace = true, features = ["clock"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid = { workspace = true, features = ["v7"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
sysinfo = { workspace = true, features = ["disk"] }

[dev-dependencies]
tempfile.workspace = true
