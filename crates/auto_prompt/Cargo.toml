[package]
name = "auto_prompt"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/auto_prompt.rs"
doctest = false

[features]
# Spawn an off-screen hidden Claude Code session to decide continue/stop for
# a Claude worker thread, instead of a LanguageModelRegistry LLM call (which
# needs an Anthropic API key). Uses Claude Code's own auth. Default-on: no
# flag needed. See .plans/014_claude_offscreen_orchestrator.md.
default = ["claude-hidden-orchestrator"]
claude-hidden-orchestrator = []

[dependencies]
acp_thread.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
chrono.workspace = true
futures.workspace = true
gpui.workspace = true
language_model.workspace = true
prompt_store.workspace = true
log.workspace = true
paths.workspace = true
project.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
util.workspace = true

[dev-dependencies]
# Test-only deps. The `test-support` features on acp_thread/project/gpui/fs/
# language_model unlock StubAgentConnection, Project::test, TestAppContext,
# FakeFs, and FakeLanguageModel respectively. Cargo unifies these with the
# regular dep features during `cargo test`.
acp_thread = { workspace = true, features = ["test-support"] }
env_logger.workspace = true
feature_flags.workspace = true
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
language_model = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
settings.workspace = true
tempfile.workspace = true